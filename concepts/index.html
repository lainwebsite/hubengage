<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HubEngage – Design concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2d57;--blue:#0079fb;--lime:#d5db26;--ink:#171a21;--mut:rgba(24,24,24,.55);--hair:rgba(14,19,32,.1);--ez:cubic-bezier(.2,.7,.15,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#fff;color:var(--ink);font-family:"Neue Montreal","PP Neue Montreal",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{flex-shrink:0;display:flex;align-items:center;height:76px;padding:0 clamp(20px,10vw,144px);background:var(--navy)}
.brand{display:flex;align-items:center;gap:6px}
.brand img{width:22px;height:22px;filter:brightness(0) invert(1)}
.brand span{color:#fff;font-size:22px;font-weight:500;letter-spacing:-1.1px;line-height:1}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px;background:radial-gradient(700px 320px at 50% 0,rgba(58,166,245,.12),transparent 70%)}
.chip{display:inline-flex;align-items:center;height:28px;padding:4px 14px;border-radius:100px;background:#fff;border:.5px solid #dedede;font-size:14px;font-weight:500;color:var(--blue)}
h1{margin:20px 0 12px;font-size:clamp(36px,6vw,60px);line-height:1.2;font-weight:500;letter-spacing:-.02em}
p.lead{margin:0 0 48px;font-size:18px;line-height:1.5;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;width:100%;max-width:720px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:28px;text-align:left;border:1px solid var(--hair);border-radius:16px;background:#fff;transition:transform .3s var(--ez),box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-3px);border-color:rgba(0,121,251,.35);box-shadow:0 14px 32px rgba(15,45,87,.1)}
.card small{font-size:14px;font-weight:500;color:var(--blue)}
.card h2{margin:0;font-size:28px;line-height:1.2;font-weight:500;letter-spacing:-.01em}
.card p{margin:0 0 20px;font-size:15px;line-height:1.5;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:auto;padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.5;color:#000;background-image:linear-gradient(116.77deg,#d5db26 21.13%,#edf092 52.14%,#d5db26 124.01%);background-size:200% 100%;background-position:0 0;transition:background-position .6s var(--ez)}
.card:hover .btn{background-position:100% 0}
.btn svg{transition:transform .35s var(--ez)}
.card:hover .btn svg{transform:translateX(4px)}
@media(max-width:640px){.cards{grid-template-columns:1fr}.nav{height:64px}}
</style>
</head>
